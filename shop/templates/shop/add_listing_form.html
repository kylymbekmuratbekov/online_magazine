<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market.kg — Жаңы жарыя жайгаштыруу</title>
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2f1 0%, #f4f6f7 100%);
            --card-bg: #ffffff;
            --text-color: #212529;
            --nav-bg: #005f73;
            --box-bg: #f8f9fa;
        }
        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #121212 0%, #1a1a1a 100%);
            --card-bg: #242424;
            --text-color: #e0e0e0;
            --nav-bg: #0d47a1;
            --box-bg: #2d2d2d;
        }
        body { background: var(--bg-gradient); color: var(--text-color); font-family: -apple-system, sans-serif; min-height: 100vh; transition: all 0.3s ease; }
        .navbar-market { background-color: var(--nav-bg); padding: 15px 0; }
        .logo-text { color: #fff; font-weight: 800; font-size: 28px; text-decoration: none; }
        .logo-text span { color: #ee9b00; }
        .form-card { border: none; border-radius: 16px; background: var(--card-bg); box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 650px; margin: 0 auto; padding: 30px; }
        .category-box { background-color: var(--box-bg); padding: 12px; border-radius: 8px; font-weight: bold; color: #ee9b00; font-size: 18px; }
        .bg-light-box { background-color: var(--box-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #ee9b00; display: none; }
        .form-label { font-weight: 600; }
        .form-control, .form-select { background-color: var(--card-bg); color: var(--text-color); }
    </style>
</head>
<body>

    <!-- Навбар -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-market shadow-sm mb-5">
        <div class="container">
            <a class="logo-text" href="/">Market<span>.kg</span></a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <select id="langSelect" class="form-select form-select-sm" style="width: 110px;" onchange="changeLanguage(this.value)">
                    <option value="ky">Кыргызча</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
                <button class="btn btn-outline-light btn-sm fw-bold" onclick="toggleTheme()" id="themeBtn">🌙 Караңгы</button>
                <a href="/" class="btn btn-outline-light btn-sm fw-bold" id="btn-cancel">← Артка</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="card form-card">
            <h3 class="fw-bold mb-3 text-center" id="page-title">✨ Жаңы жарыя жайгаштыруу</h3>

            <div class="category-box mb-4 text-center">
                <span id="txt-category">📁 Бөлүм:</span> <span id="currentCategoryName">{{ category.name }}</span>
            </div>

            <!-- ИЧИНДЕ БИР ДАГЫ DJANGO IF ТЕГИ ЖОК, КАТА ЧЫКПАЙТУУН ФОРМА -->
            <form action="{% url 'add_product_public' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" name="category" value="{{ category.id }}">

                <!-- БӨЛҮМДӨР (JavaScript аркылуу гана ачылат) -->
                <div id="box-transport" class="bg-light-box">
                    <h5 class="fw-bold text-primary mb-3" id="title-car">🚗 Унаанын мүнөздөмөлөрү:</h5>
                    <div class="mb-3"><label class="form-label" id="lbl-car-year">Чыккан жылы:</label><input type="number" name="car_year" class="form-control"></div>
                    <div class="mb-3"><label class="form-label" id="lbl-car-eng">Мотор көлөмү:</label><input type="text" name="car_engine" class="form-control"></div>
                    <div class="mb-3"><label class="form-label" id="lbl-car-mil">Пробег (км):</label><input type="number" name="car_mileage" class="form-control"></div>
                </div>

                <div id="box-elektronika" class="bg-light-box">
                    <h5 class="fw-bold text-info mb-3" id="title-tech">📺 Техниканын мүнөздөмөлөрү:</h5>
                    <div class="mb-3">
                        <label class="form-label" id="lbl-tech-type">Түрү:</label>
                        <select name="el_type" class="form-select">
                            <option value="Телефон / Смартфон">📱 Телефон / Смартфон</option>
                            <option value="Телевизор">📺 Телевизор</option>
                            <option value="Ноутбук / Компьютер">💻 Ноутбук / Компьютер</option>
                        </select>
                    </div>
                    <div class="mb-3"><label class="form-label" id="lbl-tech-mem">Память (GB):</label><input type="number" name="el_memory" class="form-control"></div>
                </div>

                <div id="box-kyimylsyz-mulk" class="bg-light-box">
                    <h5 class="fw-bold text-dark mb-3" id="title-prop">🏢 Мүлктүн мүнөздөмөлөрү:</h5>
                    <div class="mb-3">
                        <label class="form-label" id="lbl-prop-type">Мүлктүн түрү:</label>
                        <select name="property_type" class="form-select">
                            <option value="Квартира">🏢 Квартира</option>
                            <option value="Жер там">🏡 Жер там</option>
                        </select>
                    </div>
                </div>

                <!-- ЖАЛПЫ МИЛДЕТТҮҮ КУТУЧАЛАР (Ар дайым көрүнүп турат) -->
                <div class="mb-3">
                    <label id="lbl-general-title" class="form-label">Жарыянын аталышы:</label>
                    <input type="text" name="name" class="form-control" placeholder="Мисалы: iPhone 13 же Toyota Camry" required>
                </div>
                <div class="mb-3">
                    <label id="lbl-general-price" class="form-label">Баасы (сом):</label>
                    <input type="number" name="price" class="form-control" placeholder="Сан менен" required>
                </div>
                <div class="mb-3">
                    <label id="lbl-location" class="form-label">Жайгашкан жериңиз:</label>
                    <input type="text" name="location" class="form-control" placeholder="Бишкек же Ош" required>
                </div>
                <div class="mb-3">
                    <label id="lbl-phone" class="form-label">Телефон номер (WhatsApp):</label>
                    <input type="tel" name="seller_phone" class="form-control" placeholder="0555104550" required>
                </div>
                <div class="mb-3">
                    <label id="lbl-image" class="form-label">Сүрөт кошуу:</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>
                <div class="mb-3">
                    <label id="lbl-description" class="form-label">Толук сүрөттөмөсү:</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Кенен маалымат..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm" style="background-color: #005f73; border: none; border-radius: 8px;" id="btn-submit">
                    🚀 Жарыяны сайтка чыгаруу
                </button>
            </form>
        </div>
    </div>

    <script>
        function toggleTheme() {
            var currentTheme = document.documentElement.getAttribute('data-theme');
            var targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme', targetTheme);
            updateThemeBtn(targetTheme);
        }

        function updateThemeBtn(theme) {
            var btn = document.getElementById('themeBtn');
            var lang = document.getElementById('langSelect').value;
            btn.innerText = theme === 'dark' ? (lang === 'ru' ? '☀️ Светлый' : (lang === 'en' ? '☀️ Light' : '☀️ Жарык')) : (lang === 'ru' ? '🌙 Темный' : (lang === 'en' ? '🌙 Dark' : '🌙 Караңгы'));
        }

        window.addEventListener('DOMContentLoaded', function() {
            var catName = document.getElementById('currentCategoryName').innerText.toLowerCase();

            // Категориянын атына карап кошумча блокторду ачуу
            if (catName.includes('унаа') || catName.includes('транспорт') || catName.includes('авто')) {
                document.getElementById('box-transport').style.display = 'block';
            } else if (catName.includes('техника') || catName.includes('электроника') || catName.includes('телефон')) {
                document.getElementById('box-elektronika').style.display = 'block';
            } else if (catName.includes('мүлк') || catName.includes('үй') || catName.includes('квартира')) {
                document.getElementById('box-kyimylsyz-mulk').style.display = 'block';
            }

            var savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeBtn(savedTheme);

            var savedLang = localStorage.getItem('lang') || 'ky';
            document.getElementById('langSelect').value = savedLang;
            changeLanguage(savedLang);
        });

        var translations = {
            ky: { title: "✨ Жаңы жарыя жайгаштыруу", category: "📁 Бөлүм:", cancel: "← Артка", gT: "Жарыянын аталышы:", gP: "Баасы (сом):", gL: "Жайгашкан жериңиз:", gPh: "Телефон номер (WhatsApp):", gIm: "Сүрөт кошуу:", gD: "Толук сүрөттөмөсү:", btn: "🚀 Жарыяны сайтка чыгаруу" },
