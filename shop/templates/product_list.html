<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <title>Биздин Онлайн Дүкөн</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .product-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .product-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 200px; text-align: center; }
        .product-card img { max-width: 100%; height: 150px; object-fit: cover; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h1>Кош келиңиздер биздин дүкөнгө!</h1>

    <div class="product-grid">
        {% for product in products %}
            <div class="product-card">
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% endif %}
                <h3>{{ product.name }}</h3>
                <p><strong>{{ product.price }} сом</strong></p>
                <!-- JS үчүн баскыч -->
                <button class="add-to-cart-btn" data-id="{{ product.id }}">Себетке кошуу</button>
            </div>
        {% empty %}
            <p>Азырынча товарлар жок.</p>
        {% endfor %}
    </div>

    <!-- JavaScript бөлүгү (AJAX Fetch API) -->
    <script>
        document.querySelectorAll('.add-to-cart-btn').forEach(button => {
            button.addEventListener('click', function() {
                const productId = this.dataset.id;

                // Баракты жаңыртпай (Fetch API) аркылуу Django-го суроо-талап жиберүү
                fetch('/add-to-cart/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // Django коопсуздугу үчүн ЦСРФ токенди башкы беттен алабыз
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ id: productId })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        alert(data.message + " (Товардын IDси: " + productId + ")");
                    }
                })
                .catch(error => console.error('Ката кетти:', error));
            });
        });
    </script>
</body>
</html>
